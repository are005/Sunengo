  --ink:#1b1b1f; --mut:#62666d; --line:#d8dbe0; --bg:#f2f3f5; --card:#fff;
  --red:#b3151d; --red-d:#8e1017; --red-s:#fbeaeb; --ok:#1a7f4b; --ok-s:#e6f5ec; --warn:#a15c00; --warn-s:#fff3dc; --err:#c0262d; --err-s:#fde8e9;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--head);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px}.brand b{color:#e5333c}
.ttl{font-size:13px;color:#c9ccd2;flex:1;min-width:140px}
.ttl strong{color:#fff;display:block;font-size:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.1}
.btn:hover{border-color:#aaa}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:transparent;color:#fff;border-color:#4a4d55}
.btn.danger{color:var(--err);border-color:#e6b9bb}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#savest{font-size:12px;color:#9aa0a9}
nav.steps{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:57px;z-index:20;-webkit-overflow-scrolling:touch}
nav.steps button{flex:0 0 auto;border:0;background:none;padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--mut);border-bottom:3px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap}
nav.steps button.on{color:var(--red);border-bottom-color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;background:#c9ccd2;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:#e59a00}.dot.err{background:var(--err)}
main{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:19px}
.card h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--red)}
.sub{color:var(--mut);margin:0 0 12px}
details.guide{background:var(--info-s);border:1px solid #c5dcf3;border-radius:10px;padding:8px 12px;margin:10px 0 14px}
details.guide summary{cursor:pointer;font-weight:700;color:var(--info)}
details.guide .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
details.guide .g3>div{background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px}
details.guide h4{margin:0 0 3px;font-size:12px;text-transform:uppercase;color:var(--info);letter-spacing:.4px}
.grid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=email],.fld select,.fld textarea,.addbar input,.addbar select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:38px}
.fld textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #e9a3a7;border-color:var(--red)}
.qh{display:inline-flex;width:17px;height:17px;border-radius:50%;border:0;background:var(--info);color:#fff;font-size:11px;font-weight:800;cursor:pointer;margin-left:6px;vertical-align:middle;align-items:center;justify-content:center;padding:0}
.hp{background:var(--info-s);border-left:3px solid var(--info);padding:6px 9px;font-size:13px;border-radius:0 6px 6px 0;color:#1d3a5c;text-transform:none;letter-spacing:0;font-weight:400}
.hp[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;background:#fff}
.chip input{margin:0}
.chip:has(input:checked){background:var(--red-s);border-color:var(--red);color:var(--red-d);font-weight:600}
.addbar{display:grid;grid-template-columns:minmax(220px,3fr) 80px auto;gap:8px;align-items:end;background:#fafafb;border:1px dashed #c9ccd2;border-radius:10px;padding:10px;margin-bottom:12px}
.addbar .fld{margin:0}
@media(max-width:640px){.addbar{grid-template-columns:1fr}}
.rowc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.rowc>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;padding:9px 12px;font-weight:600;flex-wrap:wrap}
.rowc>summary::-webkit-details-marker{display:none}
.rowc>summary .n{background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
.rowc>summary .sm2{font-weight:400;color:var(--mut);font-size:13px;flex:1;min-width:120px}
.rowc>summary .tag{font-size:11px;border-radius:999px;padding:1px 8px;background:#eef0f3;color:#444;font-weight:600}
.rowc>summary .tag.wl{background:#e9f1ff;color:#1f5fa8}.rowc>summary .tag.bus{background:#f1ebff;color:#5a2fa8}.rowc>summary .tag.ip{background:#e5f6f3;color:#0b6b5d}
.rowc .body{padding:4px 12px 12px}
.rowc .acts{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.adv{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.adv>summary{cursor:pointer;color:var(--red);font-weight:600;font-size:13px}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px;border-left:4px solid}
.msg.ok{background:var(--ok-s);border-color:var(--ok)}.msg.warn{background:var(--warn-s);border-color:#e59a00}.msg.err{background:var(--err-s);border-color:var(--err)}.msg.info{background:var(--info-s);border-color:var(--info)}
.msg b{display:inline-block;min-width:60px}
.banner{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-weight:700;font-size:17px}
.banner.ok{background:var(--ok-s);color:var(--ok);border:1px solid #b7e0c9}.banner.warn{background:var(--warn-s);color:var(--warn);border:1px solid #f0d49a}.banner.err{background:var(--err-s);color:var(--err);border:1px solid #f0b8bb}
.banner small{display:block;font-weight:400;color:var(--ink);font-size:14px;margin-top:3px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px}
.bar{font-size:13px}.bar .bt{display:flex;justify-content:space-between}
.bar .tr{height:8px;background:#e8eaed;border-radius:6px;overflow:hidden;margin-top:2px}.bar .tr i{display:block;height:100%;background:var(--ok)}
.bar.w .tr i{background:#e59a00}.bar.e .tr i{background:var(--err)}
.desc p{margin:6px 0}.desc h4{margin:14px 0 2px;font-size:13px;text-transform:uppercase;color:var(--red);letter-spacing:.4px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;justify-content:space-between;z-index:25}
.foot .mid{color:var(--mut);align-self:center;font-size:13px}
dialog{border:0;border-radius:14px;padding:18px;max-width:520px;width:calc(100% - 28px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px}
.empty{color:var(--mut);padding:12px;text-align:center;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.docs label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:#fff}
.docs label small{display:block;color:var(--mut)}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 14px}
table.t th{background:#f0f1f3;text-align:left;padding:5px 7px;border:1px solid #c9ccd2}
table.t td{padding:4px 7px;border:1px solid #d8dbe0;vertical-align:top}
#print{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  header.top,nav.steps,main,.foot,dialog{display:none!important}
  #print{display:block}
  #print h1{font-size:18pt;margin:0 0 4px;border-bottom:3px solid var(--red);padding-bottom:4px}
  #print h2{font-size:13pt;margin:16px 0 6px;color:var(--red);break-after:avoid}
  #print .pb{break-before:page}
  #print tr{break-inside:avoid}
  #print .meta{color:#444;font-size:10pt;margin-bottom:10px}
}
@page{size:A4;margin:12mm}

/* ===== Stile SunEnGo ===== */
:root{--red:#e8731a;--red-d:#c95f0c;--red-s:#fff1e2;--head:#c7c7c7;--bg:#f2f2f1;--sun:#d9261c;--ink:#2a2a2a}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#f2f2f1}
header.top{background:#c7c7c7;color:#222;padding:8px 18px;position:sticky}
.logo{height:38px;display:block}
.sep{letter-spacing:.28em;font-size:12.5px;color:#555;border-left:1px solid #a9a9a9;padding-left:14px}
#savest{color:#555}
.btn.ghost{background:#fff;color:#222;border:0;box-shadow:0 1px 2px rgba(0,0,0,.15)}
nav.steps{background:#c7c7c7;border-bottom:0;padding:0 10px;top:54px}
nav.steps button{color:#444;font-weight:600;padding:8px 12px 7px;gap:8px;border-bottom:3px solid transparent}
nav.steps button.on{color:var(--sun);border-bottom-color:var(--sun)}
.ic{position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.ic.c0{background:linear-gradient(135deg,#e8231c,#f0501a)}.ic.c1{background:linear-gradient(135deg,#f06a14,#f5901e)}.ic.c2{background:linear-gradient(135deg,#f5a117,#f9b830)}
.ic.c3{background:linear-gradient(135deg,#f9c929,#fbdc4d)}.ic.c4{background:linear-gradient(135deg,#8a8a8a,#b5b5b5)}
.ic .dot{position:absolute;right:-4px;top:-4px;width:11px;height:11px;border:2px solid #c7c7c7}
.bnr{display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,#e77314,#f6a550);border-radius:14px;color:#fff;padding:14px 18px;margin-bottom:14px;box-shadow:0 2px 6px rgba(231,115,20,.25)}
.bnr .bi{width:56px;height:56px;border:3px solid #fff;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:0 0 auto}
.bnr .bt small{display:block;letter-spacing:.24em;text-transform:uppercase;font-size:12px;opacity:.95}
.bnr .bt b{display:block;font-size:26px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;line-height:1.15}
.card{border-radius:14px;border:1px solid #e4e4e2;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card>h3:first-child{margin:-16px -16px 14px;padding:10px 16px;background:linear-gradient(90deg,#f58b1f,#fdb515);color:#fff;border-radius:13px 13px 0 0;letter-spacing:.14em}
.card h3{color:#d0640c}
.btn{border-radius:10px;border-color:#dcdcdc}
.btn.pri{background:linear-gradient(90deg,#ef7f14,#f9a825);border-color:transparent;color:#fff}.btn.pri:hover{background:linear-gradient(90deg,#d96f0c,#f09a18)}
details.guide{background:#fff7ea;border-color:#f7d9a8}
details.guide summary{color:#b35a00}details.guide h4{color:#b35a00}
.qh{background:#f08a1c}
.hp{background:#fff7ea;border-left-color:#f08a1c;color:#5a3a10}
.rowc{border-radius:12px}
.rowc>summary .n{background:linear-gradient(135deg,#ef7f14,#f9a825)}
.chip:has(input:checked){background:#ffe9cc;border-color:#e8731a;color:#a24a00}
.addbar{background:#fffaf2;border-color:#f3c98e}
.banner{border-radius:14px}
input:focus,select:focus,textarea:focus{outline:2px solid #f7c58a;border-color:#e8731a}
@media(max-width:700px){header.top{position:static}nav.steps{top:0}.bnr .bt b{font-size:20px}.sep{display:none}}
.msg.info{background:#fff7ea;border-color:#f08a1c}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;z-index:60;font-size:14px;max-width:90%}#toast[hidden]{display:none}
#app>.card{background:none;border:0;padding:0}

function fld(path,label,o){

  if(o.type==='select') c='<select data-p="'+path+'"'+(o.rr?' data-rr="1"':'')+'>'+optHtml(o.opts,v,o.blank)+'</select>';

  else if(o.type==='check') c='<label class="chip"><input type="checkbox" data-p="'+path+'"'+(o.rr?' data-rr="1"':'')+(v?' checked':'')+'> '+esc(o.text||'Sì')+'</label>';

function counts(){
  const c={},inc=(k,n)=>{c[k]=(c[k]||0)+(n||1);};
  S.devs.forEach(d=>{const a=art(d.a);if(!a)return;const f=fam(a);let k=f.lim;if(a.f==='duo'&&d.ruolo==='rip')k='w_rip';if(k)inc(k);});
  S.zones.forEach(z=>{const a=art(z.a);if(!a)return;if(a.k==='bus')inc('sens_bus');if(a.k==='wls')inc('w_sens');});
  const k=kit();if(k&&k.kbd)inc('iu');
  inc('zone_tot',S.zones.length);
  c.zone_tot=S.zones.length;
  c.zone_wired=S.zones.filter(z=>{const a=art(z.a);return a&&a.k==='wired';}).length;
  c.uscite=S.outs.length;c.partizioni=S.parts.length;c.modalita=S.ins.length;c.scenari=S.scen.length;c.utenti=S.users.length;
  return c;
}
function usageBar(key,used,max,label){
  if(max==null)return '';
  const p=max?Math.min(100,Math.round(used*100/max)):(used?100:0),cls=used>max?'e':(max&&used/max>0.85?'w':'');
  return '<div class="bar '+cls+'"><div class="bt"><span>'+esc(label||LIMNAME[key]||key)+'</span><b>'+used+' / '+max+'</b></div><div class="tr"><i style="width:'+p+'%"></i></div></div>';
}
function capBars(keys){
  const m=model();if(!m)return '<div class="msg info">Scegli prima la centrale (passo 2) per vedere i limiti.</div>';
  const c=counts();
  return '<div class="bars">'+keys.map(k=>usageBar(k,c[k]||0,LIM(m,k))).join('')+'</div>';
}

      fld('parts.'+i+'.ti','Tempo di ingresso (s)',{type:'number',min:0,rr:0,help:'Tempo per disinserire dopo aver violato una zona ritardata in ingresso. Massimo 45 s per la norma EN 50131.'})+

    h+=rowCard(p.id,pn(i),p.desc||'(senza nome)','uscita '+(p.tu||0)+' s · ingresso '+(p.ti||0)+' s','',b,

  });

  h+='<div class="card"><h3>Modalità di inserimento'+(maxIns!=null?' ('+S.ins.length+' di max '+maxIns+')':'')+'</h3>'+
    '<p class="sub">Per ogni modalità scegli, partizione per partizione, cosa fa. Es.: "Totale" = tutte inserite con ritardo; "Disinserisci" = tutte disinserite.</p>'+
    '<div class="chips" style="margin-bottom:10px"><button type="button" class="btn sm" data-act="ins-std">Crea le modalità standard (Totale / Disinserisci)</button></div>';
  if(!S.ins.length)h+='<div class="empty">Nessuna modalità definita.</div>';
  S.ins.forEach((x,i)=>{
    x.a=x.a||{};
    const b='<div class="grid">'+fld('ins.'+i+'.nome','Nome modalità',{ph:'es. Totale, Notte, Solo perimetro'})+
      S.parts.map((p,j)=>fld('ins.'+i+'.a.'+p.id,pn(j)+' '+(p.desc||''),{type:'select',opts:Object.keys(OPT.ins_az).map(k=>({v:k,l:OPT.ins_az[k]})),blank:false})).join('')+'</div>';
    h+=rowCard(x.id,'M'+(i+1),x.nome||'(senza nome)',S.parts.map((p,j)=>pn(j)+': '+(OPT.ins_az[x.a[p.id]||'none'])).join(' · '),'',b,

  h+='<button type="button" class="btn" data-act="add-ins"'+(maxIns!=null&&S.ins.length>=maxIns?' disabled':'')+'>+ Aggiungi modalità</button></div>';
  return h;

/* ===== STEP 5: ZONE ===== */
function zoneColl(z){
  const a=art(z.a);if(!a)return null;
  if(a.k==='bus')return [{v:'BUS',l:'Su BUS (si acquisisce dal seriale)'}];
  if(a.k==='wls')return [{v:'RADIO',l:'Radio 868 MHz (si acquisisce dal seriale)'}];
  if(a.k==='ip')return [{v:'IP',l:'Zona IP (richiesta HTTP)'}];
  const o=[{v:'C',l:'Centrale (morsetti a bordo)'}];
  S.devs.forEach((d,i)=>{const da=art(d.a),c=capOf(da);if(c&&(c.zin||c.sh))o.push({v:d.id,l:devLabel(d,i)});});
  return o;
}

/* ===== REGOLE ===== */
function hasOne(pred){return S.devs.some(d=>pred(art(d.a)))||false;}
function has4G(){const k=kit();return !!(k&&k.g4)||hasOne(a=>a&&a.f==='g4');}
function wlRadioOk(){const mm=model();return (mm&&CEN[mm].radio)||S.devs.some(d=>{const a=art(d.a);return a&&a.f==='duo'&&d.ruolo!=='rip';});}
function validate(){
  const R=[],add=(lv,st,t)=>R.push({lv,st,t});
  const m=model(),c=counts(),k=kit();
  if(!S.meta.cliente)add('warn',0,'Manca il nome del cliente.');
  if(!S.cen.a){add('err',1,'Non hai scelto la centrale.');}
  else if(!m){add('err',1,'L\'articolo scelto non è una centrale lares 4.0.');}
  if(m){
    ['zone_tot','zone_wired','uscite','partizioni','modalita','scenari','utenti','iu','io','sirene','isolatori','duo','domus','energia','sens_bus','intro','w_sens','w_io','w_sirene','w_rip','w_tast','w_opera','tlc','conexa','gemino','porta'].forEach(key=>{
      const mx=LIM(m,key),u=c[key]||0;
      if(mx!=null&&u>mx)add('err',['zone_tot','zone_wired','w_sens','sens_bus'].includes(key)?4:(key==='uscite'?5:(key==='partizioni'||key==='modalita'?3:(key==='utenti'?6:(key==='scenari'?7:2)))),(LIMNAME[key]||key)+': '+u+' inseriti, ma il '+CEN[m].n+' ne gestisce al massimo '+mx+'.');
    });
    const rad=wlRadioOk(),nwl=S.devs.filter(d=>{const a=art(d.a);return a&&fam(a).wl&&a.f!=='duo';}).length+(c.w_sens||0);
    if(nwl&&!rad)add('err',2,'Hai '+nwl+' dispositivi wireless ma '+CEN[m].n+' non ha la radio a bordo: aggiungi un ricetrasmettitore duo (funzione "Ricetrasmettitore").');
    if(CEN[m].radio&&!(k&&k.ant)&&!hasOne(a=>a&&a.f==='antenna'&&/868/.test(a.d))&&nwl)add('warn',2,'La scheda wls è fornita senza antenna: aggiungi l\'antenna 868 MHz tra le periferiche (l\'antenna 4G non serve alla radio dei sensori).'+(/^KSI74/.test(S.cen.cab||'')?' Con il contenitore metallico l\'antenna va portata fuori dal metallo.':''));
    if(S.devs.some(d=>{const a=art(d.a);return a&&a.f==='duo'&&d.ruolo!=='rip';})&&CEN[m].radio)add('info',2,'Hai un duo ricetrasmettitore su una centrale che ha già la radio a bordo: serve solo se vuoi un secondo ricevitore.');
  }
  if(!S.cen.eth&&!has4G())add('warn',1,'Senza Ethernet né 4G la centrale non è raggiungibile da SecureWeb.');
  const tast=(c.iu||0)+(c.w_tast||0)+(c.conexa||0);
  if(S.cen.a&&!tast)add('warn',2,'Nessuna tastiera o touch: l\'impianto si potrà gestire solo da app o telecomando.');
  if(S.cen.a&&!(c.sirene||0)&&!(c.w_sirene||0)&&!S.outs.some(o=>o.carico==='Sirena / lampeggiante')&&!hasOne(a=>a&&/sirena|g-sirena/i.test(a.f+a.c)))add('warn',2,'Nessuna sirena prevista.');
  S.devs.forEach((d,i)=>{const a=art(d.a);if(!a)add('err',2,'Periferica D'+(i+1)+': articolo non trovato.');else{const f=fam(a);if((f.bus||f.wl)&&!f.ip&&!d.sn&&a.f!=='antenna'&&!d.kit)add('warn',2,devLabel(d,i)+': manca il numero seriale per l\'acquisizione.');}});
  // partizioni
  S.parts.forEach((p,i)=>{
    if(Number(p.ti)>45)add('err',3,pn(i)+': tempo di ingresso '+p.ti+' s, oltre i 45 s ammessi da EN 50131.');
    if(!S.zones.some(z=>(z.parts||[]).includes(p.id)))add('warn',3,pn(i)+' "'+(p.desc||'')+'" non ha nessuna zona.');
    if(S.ins.length&&!S.ins.some(x=>x.a&&x.a[p.id]==='dis'))add('err',3,pn(i)+' "'+(p.desc||'')+'" non viene disinserita da nessuna modalità: nessuno potrebbe spegnerla.');
  });
  if(!S.ins.length)add('warn',3,'Nessuna modalità di inserimento definita (es. Totale / Disinserisci).');
  else{S.ins.forEach((x,i)=>{if(!x.nome)add('warn',3,'Modalità M'+(i+1)+' senza nome.');if(!S.parts.some(p=>x.a&&x.a[p.id]&&x.a[p.id]!=='none'))add('warn',3,'Modalità "'+(x.nome||'M'+(i+1))+'" non fa nulla su nessuna partizione.');});
    if(!S.ins.some(x=>S.parts.some(p=>['ritardo','ins','comm'].includes(x.a&&x.a[p.id]))))add('warn',3,'Nessuna modalità inserisce l\'impianto.');}
  // zone
  const useC={z:0,o:0},useD={};
  S.zones.forEach((z,i)=>{
    const a=art(z.a),lab='Z'+(i+1)+' '+(z.desc||'');
    if(!a){add('err',4,lab+': scegli l\'articolo.');return;}
    if(!(z.parts||[]).length)add('err',4,lab+': non appartiene a nessuna partizione.');
    if(a.k==='wired'){
      if(!z.coll)add('err',4,lab+': indica a cosa è collegata (centrale o modulo).');
      else if(z.coll==='C')useC.z++;else{useD[z.coll]=useD[z.coll]||{z:0,o:0};useD[z.coll].z++;if(!S.devs.some(d=>d.id===z.coll))add('err',4,lab+': il modulo scelto non esiste più.');}
      if(!z.bil)add('warn',4,lab+': bilanciamento non scelto.');
      if(/(NC|NA)\)/.test(z.bil||''))add('warn',4,lab+': NC/NA disabilita il sabotaggio e non è certificato IMQ.');
    }
    if((a.k==='bus'||a.k==='wls')&&!z.sn&&!z.kit)add('warn',4,lab+': manca il numero seriale.');
    if(z.sempre&&z.emerg)add('err',4,lab+': "Sempre attiva" e "Uscita di emergenza" sono incompatibili.');
    if(z.preall&&(z.sempre||z.emerg||z.test))add('err',4,lab+': il preallarme non è compatibile con Sempre attiva, Uscita di emergenza o Test.');
    if(z.ritardo&&z.parts&&!z.parts.length)add('warn',4,lab+': zona ritardata senza partizione.');
    if(a.k==='wired'&&z.coll==='C'&&['Tapparella','Inerziale/Rottura vetro','Analogica'].includes(z.modo))add('err',4,lab+': sulla scheda della centrale sono disponibili solo le modalità Standard e Comando (manuale pag. 81). Collegala a un modulo auxi.');
    if(z.ritardo&&!z.logica)add('warn',4,lab+': ritardata in ingresso ma con logica di uscita Immediata (predefinita): chi esce fa scattare l\'allarme. Imposta "Ritardata" (o "Ultima uscita" per la porta d\'ingresso).');
    if(z.sempre)add('info',4,lab+': sempre attiva (non certificata IMQ).');
    if(z.modo==='Comando'&&!S.scen.length&&!S.ev.length)add('info',4,lab+': zona Comando senza scenari/eventi: non farà nulla.');
  });
  // capacità collegamenti
  if(m){
    const cm=CEN[m];
    S.outs.forEach(o=>{if(o.coll==='C')useC.o++;else if(o.coll&&o.coll!=='V'){useD[o.coll]=useD[o.coll]||{z:0,o:0};useD[o.coll].o++;}});
    const sharedC=Math.max(0,useC.z-cm.inB)+useC.o;
    if(useC.z>cm.inB+cm.ioT)add('err',4,'Sulla centrale hai collegato '+useC.z+' zone filari ma i morsetti sono '+cm.inB+' ingressi + '+cm.ioT+' I/O.');
    else if(sharedC>cm.ioT)add('err',5,'I morsetti I/O della centrale ('+cm.ioT+') non bastano: ci sono '+useC.o+' uscite e '+Math.max(0,useC.z-cm.inB)+' zone oltre gli ingressi dedicati.');
    S.devs.forEach((d,i)=>{const cap=capOf(art(d.a));if(!cap)return;const u=useD[d.id]||{z:0,o:0},zin=cap.zin||0,zout=cap.zout||0,sh=cap.sh||0;
      const sharedUse=Math.max(0,u.z-zin)+Math.max(0,u.o-zout);
      if(u.z>zin+sh||u.o>zout+sh||sharedUse>sh)add('err',u.o?5:4,devLabel(d,i)+': collegati '+u.z+' ingressi e '+u.o+' uscite, ma il modulo ha '+zin+' ingressi, '+zout+' uscite'+(sh?' e '+sh+' morsetti configurabili':'')+'.');});
  }
  // uscite
  S.outs.forEach((o,i)=>{
    const lab='U'+(i+1)+' '+(o.desc||'');
    if(!o.coll)add('err',5,lab+': indica a cosa è collegata.');
    if(o.modo==='Monostabile'&&!Number(o.ton))add('warn',5,lab+': monostabile senza tempo di ON.');
    if(o.carico==='Tapparella / avvolgibile'&&o.modo!=='Avvolgibile')add('warn',5,lab+': per le tapparelle la modalità più adatta è "Avvolgibile".');
    if(o.carico==='Caldaia / climatizzazione'&&o.modo!=='Termoregolazione')add('info',5,lab+': per la caldaia valuta la modalità "Termoregolazione".');
  });
  if(S.outs.length&&!S.outs.some(o=>o.modo==='Guasto')&&m&&CEN[m].grado>=2)add('info',5,'Per EN 50131 è consigliata un\'uscita in modalità "Guasto" (segnalazione guasti).');
  // utenti
  if(!S.users.length)add('warn',6,'Nessun utente: aggiungi almeno l\'amministratore.');
  else{if(!S.users.some(u=>u.livello==='Amministratore'))add('warn',6,'Nessun utente Amministratore.');
    S.users.forEach((u,i)=>{if(!u.nome)add('warn',6,'Utente N'+(i+1)+' senza nome.');if(!(u.parts||[]).length)add('warn',6,'Utente "'+(u.nome||'N'+(i+1))+'" non gestisce nessuna partizione.');});}
  // automazioni
  S.scen.forEach((s,i)=>{const lab='Scenario "'+(s.nome||'S'+(i+1))+'"';if(!(s.az||[]).length)add('warn',7,lab+' non ha azioni.');
    (s.az||[]).forEach(a=>{if(!a.t||!a.a)add('warn',7,lab+': azione incompleta.');else{const o=tgOpts(a.t);if(o&&!a.tg)add('warn',7,lab+': azione "'+a.a+'" senza bersaglio.');else if(o&&!o.some(x=>x.v===a.tg))add('err',7,lab+': il bersaglio di un\'azione non esiste più.');}});});
  const INSV={'Inserisci con ritardo':'ritardo','Inserisci istantaneo':'ins','Disinserisci':'dis','Commuta':'comm'};
  S.scen.forEach((s,i)=>{const w={};(s.az||[]).forEach(a=>{if(a.t==='Partizione'&&INSV[a.a]&&a.tg)w[a.tg]=INSV[a.a];});const ks=Object.keys(w);if(!ks.length)return;
    const ok=S.ins.some(x=>{const g=Object.entries(x.a||{}).filter(([p,v])=>v&&v!=='none');return g.length===ks.length&&g.every(([p,v])=>w[p]===v);});
    if(!ok)add('warn',7,'Scenario "'+(s.nome||'S'+(i+1))+'": in centrale uno scenario richiama una modalità di inserimento, ma nessuna modalità fa esattamente queste azioni sulle partizioni. Crea una modalità dedicata al passo 4.');});
  S.ev.forEach((e,i)=>{if(!e.tipo)add('warn',7,'Evento E'+(i+1)+' incompleto.');if(!e.scen||!S.scen.some(s=>s.id===e.scen))add('err',7,'Evento E'+(i+1)+': scegli uno scenario esistente.');});
  S.notif.forEach((n,i)=>{if(!n.tipo)add('warn',7,'Notifica A'+(i+1)+' incompleta.');if(!(n.canali||[]).length||!(n.users||[]).length)add('warn',7,'Notifica A'+(i+1)+': scegli canali e utenti.');
    (n.users||[]).forEach(uid_=>{const u=S.users.find(x=>x.id===uid_);if(!u)return;if(((n.canali||[]).includes('Chiamata vocale')||(n.canali||[]).includes('SMS'))&&!u.tel)add('warn',7,'Notifica A'+(i+1)+': "'+(u.nome||'utente')+'" non ha il telefono.');if((n.canali||[]).includes('Email')&&!u.email)add('warn',7,'Notifica A'+(i+1)+': "'+(u.nome||'utente')+'" non ha l\'email.');});});
  const chs=new Set();S.notif.forEach(n=>(n.canali||[]).forEach(x=>chs.add(x)));
  if(chs.has('Email'))add('info',7,'Notifiche email: in centrale va configurato il server SMTP (Opzioni → Rete).');
  if((chs.has('SMS')||chs.has('Chiamata vocale'))&&!has4G()&&!hasOne(a=>a&&a.f==='pstn'))add('err',7,'Notifiche con SMS o chiamata: serve il modulo 4G (o PSTN) con SIM.');
  if(chs.has('Notifica push'))add('info',7,'Le notifiche push arrivano dall\'app lares 4.0 degli utenti: le Liste contatti in centrale gestiscono chiamata, SMS, email, Contact-ID e SIA IP.');
  const nTele=S.users.filter(u=>u.tele).length,nOp=S.devs.filter(d=>{const a=art(d.a);return a&&a.f==='opera';}).length;
  if(nTele!==nOp)add('warn',6,'Utenti con telecomando: '+nTele+', telecomandi opera tra le periferiche: '+nOp+'. In centrale il seriale del telecomando si inserisce nella pagina dell\'utente.');
  const ob=S.meta.obj||[];
  if(ob.includes('Videosorveglianza')&&!(c.tlc||0)&&!S.devs.some(d=>{const a=art(d.a);return a&&a.f==='nvr';}))add('warn',2,'Hai richiesto la videosorveglianza ma non hai inserito telecamere IP o NVR.');
  if(ob.includes('Domotica')&&!S.outs.length)add('warn',5,'Hai richiesto la domotica ma non ci sono uscite (luci, tapparelle…).');
  if(ob.includes('KNX')&&!(c.porta||0)&&!S.integ.knx)add('warn',2,'KNX richiesto: serve la porta 4.0 tra le periferiche e l\'opzione KNX al passo 8.');
  if(S.integ.knx&&!(c.porta||0))add('warn',2,'Integrazione KNX attiva ma manca la porta 4.0.');
  if(ob.includes('Vigilanza')&&!S.integ.vig)add('warn',7,'Collegamento a vigilanza richiesto: scegli il protocollo (Contact ID / SIA) al passo 8.');
  return R;
}
function stepStatus(R){const o={};R.forEach(r=>{const cur=o[r.st];if(r.lv==='err')o[r.st]='err';else if(r.lv==='warn'&&cur!=='err')o[r.st]='warn';});return o;}

/* ===== DISTINTA ===== */
function bom(){
  const M=new Map(),add=(code,q,kit)=>{if(!code)return;const r=M.get(code)||{c:code,q:0,qk:0};r.q+=q;if(kit)r.qk+=q;M.set(code,r);};
  if(S.cen.a)add(S.cen.a,1,false);
  if(S.cen.cab&&art(S.cen.cab))add(S.cen.cab,1,false);
  S.devs.forEach(d=>add(d.a,1,d.kit));
  S.zones.forEach(z=>add(z.a,1,z.kit));
  return [...M.values()].map(r=>{const a=art(r.c);return {c:acode(a),d:a?a.d:'(non trovato)',q:r.q,qk:r.qk,o:Math.max(0,r.q-r.qk),g:a?(a.custom?'Aggiunto da me':(a.gen?'Generico':(a.g||''))):''};}).sort((x,y)=>x.g.localeCompare(y.g)||x.c.localeCompare(y.c));
}

  $('#app').innerHTML='<div class="bnr"><div class="bi"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+SICON[step]+'</svg></div><div class="bt"><small>Ksenia lares 4.0 · passo '+(step+1)+' di '+STEPS.length+'</small><b>'+esc(CURTITLE)+'</b></div></div><div class="card">'+body+'</div>';
  // le funzioni step producono già blocchi .card interni: rimuovo il contenitore esterno se serve
  renderNav();
  if(keep!==false)window.scrollTo(0,y);
}
function renderNav(){
  const R=validate(),st=stepStatus(R);
  $('#nav').innerHTML=STEPS.map((s,i)=>'<button type="button" data-act="goto" data-st="'+i+'" class="'+(i===step?'on':'')+'"><span class="ic c'+(i%5)+'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+SICON[i]+'</svg><i class="dot '+(st[i]||'')+'"></i></span>'+esc(s.t.replace(/^\d+ · /,''))+'</button>').join('');
  const on=$('#nav .on');if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}
  $('#prev').disabled=step===0;$('#next').disabled=step===STEPS.length-1;
  $('#mid').textContent='Passo '+(step+1)+' di '+STEPS.length;
}
function goto(i){step=Math.max(0,Math.min(STEPS.length-1,i));save();render(false);window.scrollTo(0,0);}

/* ===== AZIONI ===== */
function toast(t){const d=$('#toast');d.textContent=t;d.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{d.hidden=true;},2600);}
let PENDING=null;
function qty(id){return Math.max(1,Math.min(200,parseInt($(id).value,10)||1));}
function newDev(code){return {id:uid(),a:code,desc:'',sn:'',ip:'',ramo:'1',ruolo:'ric',kit:false,note:''};}
function newZone(code){
  const a=art(code),z={id:uid(),a:code,desc:'',ubic:'',coll:'',sn:'',parts:S.parts.length===1?[S.parts[0].id]:[],modo:(a&&a.modo)||'Standard',bil:''};
  if(a&&a.k==='wired')z.coll='C';
  if(a&&a.k==='wired')z.bil=/G-VOL|G-FUMO|G-TECN|G-CONT|G-BARR|G-VETRO|G-TAPP/.test(a.c)?'Bilanciato 10K':'';
  return z;
}
function openNew(el){
  PENDING=el;
  const ctx=el.dataset.ctx||'dev';
  $('#nwTipo').innerHTML=optHtml(ctx==='zone'?[{v:'sw',l:'Sensore filare'},{v:'sb',l:'Sensore BUS'},{v:'sr',l:'Sensore wireless'}]:[{v:'pb',l:'Periferica BUS'},{v:'pr',l:'Periferica wireless'},{v:'pi',l:'Periferica IP'},{v:'pa',l:'Altro accessorio (nessun collegamento)'}],'',false);
  ['nwCod','nwDesc'].forEach(i=>$('#'+i).value='');$('#nwIn').value='0';$('#nwOut').value='0';
  $('#nwCapRow').hidden=false;
  $('#dlgNew').showModal();
}
function saveNew(){
  const d=$('#nwDesc').value.trim(),cc=$('#nwCod').value.trim(),t=$('#nwTipo').value;
  if(!d){toast('Scrivi la descrizione dell\'articolo');return;}
  const o={c:'X-'+uid(),cc:cc,d:d,g:'Articoli aggiunti da me',custom:1};
  if(t==='sw'){o.k='wired';o.f='csens';}else if(t==='sb'){o.k='bus';o.f='csens';}else if(t==='sr'){o.k='wls';o.f='csens';}
  else{o.f=t==='pb'?'cbus':(t==='pr'?'cwl':(t==='pi'?'cip':'caltro'));const zi=parseInt($('#nwIn').value,10)||0,zo=parseInt($('#nwOut').value,10)||0;if(zi||zo)o.cap={zin:zi,zout:zo};}
  CUSTOM.push(o);saveCustom();
  const el=PENDING;PENDING=null;$('#dlgNew').close();
  if(el&&el.dataset&&el.dataset.p){setP(el.dataset.p,o.c);applyZoneSideEffects(el.dataset.p);touch();render();}
  else{render();if(el&&el.id&&$('#'+el.id))$('#'+el.id).value=o.c;}
  toast('Articolo aggiunto al menu');
}
function applyZoneSideEffects(path){
  const m=/^zones\.(\d+)\.a$/.exec(path);
  if(m){const z=S.zones[+m[1]],a=art(z.a);if(a){z.modo=a.modo||'Standard';z.coll=a.k==='wired'?(z.coll||'C'):'';if(a.k!=='wired')z.bil='';}}
}
function act(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,L=b.dataset.list;
  if(a==='help'){const f=b.closest('.fld');const hp=f&&f.querySelector('.hp');if(hp)hp.hidden=!hp.hidden;return;}
  if(a==='goto'){goto(+b.dataset.st);return;}
  if(a==='add-dev'){const v=$('#addDevArt').value;if(!v){toast('Scegli un articolo dal menu');return;}if(v==='__new'){openNew($('#addDevArt'));return;}const n=qty('#addDevQty');for(let q=0;q<n;q++)S.devs.push(newDev(v));touch();render();toast(n+' aggiunt'+(n>1?'i':'o'));return;}
  if(a==='quick'){S.devs.push(newDev(b.dataset.code));touch();render();return;}
  if(a==='add-zone'){const v=$('#addZoneArt').value;if(!v){toast('Scegli un sensore dal menu');return;}if(v==='__new'){openNew($('#addZoneArt'));return;}const n=qty('#addZoneQty'),an=art(v);for(let q=0;q<n;q++){const z=newZone(v);z.desc=ashort(an)+(n>1?' '+(q+1):'');S.zones.push(z);}touch();render();toast(n+' zon'+(n>1?'e aggiunte':'a aggiunta'));return;}
  if(a==='add-out'){const k=$('#addOutKind').value,n=qty('#addOutQty');for(let q=0;q<n;q++)S.outs.push({id:uid(),desc:k+(n>1?' '+(q+1):''),carico:k,modo:CARICO_MODO[k]||'Bistabile',coll:'C',parts:[],ton:(CARICO_MODO[k]==='Monostabile'?2:'')});touch();render();toast(n+' uscit'+(n>1?'e aggiunte':'a aggiunta'));return;}
  if(a==='add-part'){const p={id:uid(),desc:'',tu:30,ti:20,ciclo:3,ronda:'',negl:''};S.parts.push(p);S.ins.forEach(x=>{x.a=x.a||{};x.a[p.id]='none';});OPEN[p.id]=true;touch();render();return;}
  if(a==='add-ins'){const x={id:uid(),nome:'',a:{}};S.parts.forEach(p=>x.a[p.id]='none');S.ins.push(x);OPEN[x.id]=true;touch();render();return;}
  if(a==='ins-std'){const has=n=>S.ins.some(x=>(x.nome||'').toLowerCase()===n.toLowerCase());
    if(!has('Totale')){const x={id:uid(),nome:'Totale',a:{}};S.parts.forEach(p=>x.a[p.id]='ritardo');S.ins.push(x);}
    if(!has('Disinserisci')){const x={id:uid(),nome:'Disinserisci',a:{}};S.parts.forEach(p=>x.a[p.id]='dis');S.ins.push(x);}
    touch();render();return;}
  if(a==='add-user'){const u={id:uid(),nome:'',livello:S.users.length?'Standard':'Amministratore',parts:S.parts.map(p=>p.id)};S.users.push(u);OPEN[u.id]=true;touch();render();return;}
  if(a==='add-scen'){const s={id:uid(),nome:'',gest:'Con PIN',az:[]};S.scen.push(s);OPEN[s.id]=true;touch();render();return;}
  if(a==='add-az'){S.scen[i].az.push({id:uid(),t:'',a:'',tg:''});touch();render();return;}
  if(a==='del-az'){S.scen[i].az.splice(+b.dataset.j,1);touch();render();return;}
  if(a==='add-ev'){const o={id:uid(),cat:'',tipo:'',src:'',scen:''};S.ev.push(o);OPEN[o.id]=true;touch();render();return;}
  if(a==='add-notif'){const o={id:uid(),cat:'',tipo:'',src:'',canali:[],users:[]};S.notif.push(o);OPEN[o.id]=true;touch();render();return;}
  if(a==='del'){if(!confirm('Eliminare questa voce?'))return;const it=S[L][i];S[L].splice(i,1);
    if(L==='parts'){S.ins.forEach(x=>{if(x.a)delete x.a[it.id];});['zones','outs','users'].forEach(k=>S[k].forEach(o=>{if(o.parts)o.parts=o.parts.filter(id=>id!==it.id);}));}
    if(L==='devs'){S.zones.forEach(z=>{if(z.coll===it.id)z.coll='';});S.outs.forEach(o=>{if(o.coll===it.id)o.coll='';});}
    touch();render();return;}
  if(a==='dup'){const it=JSON.parse(JSON.stringify(S[L][i]));it.id=uid();if(it.sn)it.sn='';S[L].splice(i+1,0,it);touch();render();return;}
  if(a==='prev'){goto(step-1);return;}
  if(a==='next'){goto(step+1);return;}
  if(a==='run-test'){LASTTEST=runTest();$('#testout').innerHTML=LASTTEST.html;$('#testout').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(a==='print'){doPrint();return;}
  if(a==='exp-json'){expJson();return;}
  if(a==='exp-csv'){expCsv();return;}
  if(a==='imp'){$('#impFile').click();return;}
  if(a==='reset'){if(confirm('Iniziare un nuovo cantiere? I dati attuali verranno cancellati (esporta prima il file .json se ti servono).')){S=blank();step=0;LASTTEST=null;OPEN={};save();render(false);window.scrollTo(0,0);}return;}
  if(a==='new-cancel'){if($('#dlgNew').open)$('#dlgNew').close();PENDING=null;render();return;}
  if(a==='new-save'){saveNew();return;}
}
function onChange(e){
  const t=e.target;
  if(t.dataset&&t.dataset.doc!==undefined)return;
  if(t.dataset&&t.dataset.arr){const p=t.dataset.arr,v=t.dataset.v;let ar=getP(p);if(!Array.isArray(ar)){ar=[];setP(p,ar);}const ix=ar.indexOf(v);if(t.checked&&ix<0)ar.push(v);if(!t.checked&&ix>=0)ar.splice(ix,1);touch();return;}
  if(t.tagName==='SELECT'&&t.value==='__new'&&t.dataset.ctx){openNew(t);return;}
  if(!t.dataset||!t.dataset.p)return;
  const val=t.type==='checkbox'?t.checked:t.value;
  setP(t.dataset.p,val);
  if(t.dataset.p==='cen.a'){const k=kit();if(k&&k.cab)S.cen.cab='';}
  applyZoneSideEffects(t.dataset.p);
  touch();
  if(t.dataset.rr==='1')render();
  else if(t.dataset.p.match(/\.(cat|t)$/)){const m=/^(ev|notif|scen)\.(\d+)/.exec(t.dataset.p);if(m){if(/\.cat$/.test(t.dataset.p))setP(t.dataset.p.replace(/cat$/,'tipo'),'');if(/\.t$/.test(t.dataset.p)){setP(t.dataset.p.replace(/\.t$/,'.a'),'');setP(t.dataset.p.replace(/\.t$/,'.tg'),'');}render();}}
}
function onInput(e){const t=e.target;if(!t.dataset||!t.dataset.p)return;if(t.tagName==='SELECT'||t.type==='checkbox')return;setP(t.dataset.p,t.value);touch();}

/* ===== STAMPA ED ESPORTAZIONE ===== */
function today(){return new Date().toLocaleDateString('it-IT');}
function doPrint(){
  const sel=$$('input[data-doc]').filter(x=>x.checked).map(x=>x.dataset.doc);
  if(!sel.length){toast('Seleziona almeno un documento');return;}
  let h='<h1>Programma impianto — Ksenia lares 4.0</h1><div class="meta">'+esc(S.meta.cliente||'(cliente)')+' · '+esc(S.meta.indirizzo||'')+' · generato il '+today()+'</div>';
  DOCS.filter(d=>sel.includes(d.id)).forEach((d,i)=>{h+='<div class="'+(i?'pb':'')+'">'+d.fn()+'</div>';});
  h+='<p class="meta" style="margin-top:20px">Nessun PIN o password è incluso in questo documento.</p>';
  $('#print').innerHTML=h;
  setTimeout(()=>window.print(),50);
}
function fname(ext){const c=(S.meta.cliente||'impianto').replace(/[^\w\-]+/g,'_').slice(0,30);return 'Impianto_'+c+'_'+new Date().toISOString().slice(0,10)+'.'+ext;}
function dl(name,text,type){const b=new Blob([text],{type:type||'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);}
function expJson(){dl(fname('json'),JSON.stringify({tipo:'ksenia-lares40-impianto',versione:1,data:new Date().toISOString(),impianto:S,articoli_aggiunti:CUSTOM},null,1),'application/json');toast('File salvato: allegalo a Claude');}
function expCsv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Codice','Descrizione','Gruppo','Totale','Nel kit','Da ordinare']].concat(bom().map(r=>[r.c,r.d,r.g,r.q,r.qk,r.o]));dl(fname('csv'),'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv');}
function impFile(f){
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!o.impianto)throw new Error('Formato non riconosciuto');
    if(Array.isArray(o.articoli_aggiunti))o.articoli_aggiunti.forEach(a=>{if(a&&a.c&&!CUSTOM.some(x=>x.c===a.c))CUSTOM.push(a);});
    saveCustom();S=migrate(o.impianto);LASTTEST=null;OPEN={};step=0;save();render(false);toast('Impianto caricato');}catch(er){toast('File non valido: '+er.message);}};
  rd.readAsText(f);
}

/* ===== AVVIO ===== */
function init(){
  load();
  const app=$('#app');
  app.addEventListener('click',act);
  app.addEventListener('change',onChange);
  app.addEventListener('input',onInput);
  app.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.oid)OPEN[d.dataset.oid]=d.open;},true);
  $('#nav').addEventListener('click',act);
  $('#foot').addEventListener('click',act);
  $('header.top').addEventListener('click',act);
  $('#dlgNew').addEventListener('click',act);
  $('#dlgNew').addEventListener('cancel',()=>{PENDING=null;render();});
  $('#impFile').addEventListener('change',e=>{if(e.target.files[0])impFile(e.target.files[0]);e.target.value='';});
  render(false);
}
document.addEventListener('DOMContentLoaded',init);
