name: App Android

on:
  push:
    paths:
      - 'huawei/**'
      - 'android-app/**'
      - 'icon-*.png'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dipendenze
        working-directory: android-app
        run: npm ci

      - name: Progetto Android
        working-directory: android-app
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash prepare.sh

      # Firma sempre con la stessa chiave: gli aggiornamenti si installano sopra senza disinstallare l'app
      - name: Chiave di firma
        run: mkdir -p ~/.android && cp android-app/keystore/debug.keystore ~/.android/debug.keystore

      - name: Compila APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Nome del file
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "DatiHuawei-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DatiHuawei-1.0.${{ github.run_number }}
          path: DatiHuawei-1.0.${{ github.run_number }}.apk
          retention-days: 90
