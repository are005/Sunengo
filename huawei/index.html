  --ink:#1b1b1f; --mut:#62666d; --line:#d8dbe0; --bg:#f2f3f5; --card:#fff;
  --red:#b3151d; --red-d:#8e1017; --red-s:#fbeaeb; --ok:#1a7f4b; --ok-s:#e6f5ec; --warn:#a15c00; --warn-s:#fff3dc; --err:#c0262d; --err-s:#fde8e9;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--head);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px}.brand b{color:#e5333c}
.ttl{font-size:13px;color:#c9ccd2;flex:1;min-width:140px}
.ttl strong{color:#fff;display:block;font-size:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.1}
.btn:hover{border-color:#aaa}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:transparent;color:#fff;border-color:#4a4d55}
.btn.danger{color:var(--err);border-color:#e6b9bb}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#savest{font-size:12px;color:#9aa0a9}
nav.steps{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:57px;z-index:20;-webkit-overflow-scrolling:touch}
nav.steps button{flex:0 0 auto;border:0;background:none;padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--mut);border-bottom:3px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap}
nav.steps button.on{color:var(--red);border-bottom-color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;background:#c9ccd2;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:#e59a00}.dot.err{background:var(--err)}
main{max-width:1100px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:19px}
.card h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--red)}
.sub{color:var(--mut);margin:0 0 12px}
details.guide{background:var(--info-s);border:1px solid #c5dcf3;border-radius:10px;padding:8px 12px;margin:10px 0 14px}
details.guide summary{cursor:pointer;font-weight:700;color:var(--info)}
details.guide .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
details.guide .g3>div{background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px}
details.guide h4{margin:0 0 3px;font-size:12px;text-transform:uppercase;color:var(--info);letter-spacing:.4px}
.grid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=email],.fld select,.fld textarea,.addbar input,.addbar select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:38px}
.fld textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #e9a3a7;border-color:var(--red)}
.qh{display:inline-flex;width:17px;height:17px;border-radius:50%;border:0;background:var(--info);color:#fff;font-size:11px;font-weight:800;cursor:pointer;margin-left:6px;vertical-align:middle;align-items:center;justify-content:center;padding:0}
.hp{background:var(--info-s);border-left:3px solid var(--info);padding:6px 9px;font-size:13px;border-radius:0 6px 6px 0;color:#1d3a5c;text-transform:none;letter-spacing:0;font-weight:400}
.hp[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;background:#fff}
.chip input{margin:0}
.chip:has(input:checked){background:var(--red-s);border-color:var(--red);color:var(--red-d);font-weight:600}
.addbar{display:grid;grid-template-columns:minmax(220px,3fr) 80px auto;gap:8px;align-items:end;background:#fafafb;border:1px dashed #c9ccd2;border-radius:10px;padding:10px;margin-bottom:12px}
.addbar .fld{margin:0}
@media(max-width:640px){.addbar{grid-template-columns:1fr}}
.rowc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
.rowc>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;padding:9px 12px;font-weight:600;flex-wrap:wrap}
.rowc>summary::-webkit-details-marker{display:none}
.rowc>summary .n{background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
.rowc>summary .sm2{font-weight:400;color:var(--mut);font-size:13px;flex:1;min-width:120px}
.rowc>summary .tag{font-size:11px;border-radius:999px;padding:1px 8px;background:#eef0f3;color:#444;font-weight:600}
.rowc>summary .tag.wl{background:#e9f1ff;color:#1f5fa8}.rowc>summary .tag.bus{background:#f1ebff;color:#5a2fa8}.rowc>summary .tag.ip{background:#e5f6f3;color:#0b6b5d}
.rowc .body{padding:4px 12px 12px}
.rowc .acts{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.adv{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.adv>summary{cursor:pointer;color:var(--red);font-weight:600;font-size:13px}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px;border-left:4px solid}
.msg.ok{background:var(--ok-s);border-color:var(--ok)}.msg.warn{background:var(--warn-s);border-color:#e59a00}.msg.err{background:var(--err-s);border-color:var(--err)}.msg.info{background:var(--info-s);border-color:var(--info)}
.msg b{display:inline-block;min-width:60px}
.banner{border-radius:12px;padding:14px 16px;margin-bottom:14px;font-weight:700;font-size:17px}
.banner.ok{background:var(--ok-s);color:var(--ok);border:1px solid #b7e0c9}.banner.warn{background:var(--warn-s);color:var(--warn);border:1px solid #f0d49a}.banner.err{background:var(--err-s);color:var(--err);border:1px solid #f0b8bb}
.banner small{display:block;font-weight:400;color:var(--ink);font-size:14px;margin-top:3px}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px}
.bar{font-size:13px}.bar .bt{display:flex;justify-content:space-between}
.bar .tr{height:8px;background:#e8eaed;border-radius:6px;overflow:hidden;margin-top:2px}.bar .tr i{display:block;height:100%;background:var(--ok)}
.bar.w .tr i{background:#e59a00}.bar.e .tr i{background:var(--err)}
.desc p{margin:6px 0}.desc h4{margin:14px 0 2px;font-size:13px;text-transform:uppercase;color:var(--red);letter-spacing:.4px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;justify-content:space-between;z-index:25}
.foot .mid{color:var(--mut);align-self:center;font-size:13px}
dialog{border:0;border-radius:14px;padding:18px;max-width:520px;width:calc(100% - 28px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px}
.empty{color:var(--mut);padding:12px;text-align:center;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.docs label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:#fff}
.docs label small{display:block;color:var(--mut)}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 14px}
table.t th{background:#f0f1f3;text-align:left;padding:5px 7px;border:1px solid #c9ccd2}
table.t td{padding:4px 7px;border:1px solid #d8dbe0;vertical-align:top}
#print{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  header.top,nav.steps,main,.foot,dialog{display:none!important}
  #print{display:block}
  #print h1{font-size:18pt;margin:0 0 4px;border-bottom:3px solid var(--red);padding-bottom:4px}
  #print h2{font-size:13pt;margin:16px 0 6px;color:var(--red);break-after:avoid}
  #print .pb{break-before:page}
  #print tr{break-inside:avoid}
  #print .meta{color:#444;font-size:10pt;margin-bottom:10px}
}
@page{size:A4;margin:12mm}

/* ===== Stile SunEnGo ===== */
:root{--red:#e8731a;--red-d:#c95f0c;--red-s:#fff1e2;--head:#c7c7c7;--bg:#f2f2f1;--sun:#d9261c;--ink:#2a2a2a}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:#f2f2f1}
header.top{background:#c7c7c7;color:#222;padding:8px 18px;position:sticky}
.logo{height:38px;display:block}
.sep{letter-spacing:.28em;font-size:12.5px;color:#555;border-left:1px solid #a9a9a9;padding-left:14px}
#savest{color:#555}
.btn.ghost{background:#fff;color:#222;border:0;box-shadow:0 1px 2px rgba(0,0,0,.15)}
nav.steps{background:#c7c7c7;border-bottom:0;padding:0 10px;top:54px}
nav.steps button{color:#444;font-weight:600;padding:8px 12px 7px;gap:8px;border-bottom:3px solid transparent}
nav.steps button.on{color:var(--sun);border-bottom-color:var(--sun)}
.ic{position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.ic.c0{background:linear-gradient(135deg,#e8231c,#f0501a)}.ic.c1{background:linear-gradient(135deg,#f06a14,#f5901e)}.ic.c2{background:linear-gradient(135deg,#f5a117,#f9b830)}
.ic.c3{background:linear-gradient(135deg,#f9c929,#fbdc4d)}.ic.c4{background:linear-gradient(135deg,#8a8a8a,#b5b5b5)}
.ic .dot{position:absolute;right:-4px;top:-4px;width:11px;height:11px;border:2px solid #c7c7c7}
.bnr{display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,#e77314,#f6a550);border-radius:14px;color:#fff;padding:14px 18px;margin-bottom:14px;box-shadow:0 2px 6px rgba(231,115,20,.25)}
.bnr .bi{width:56px;height:56px;border:3px solid #fff;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:0 0 auto}
.bnr .bt small{display:block;letter-spacing:.24em;text-transform:uppercase;font-size:12px;opacity:.95}
.bnr .bt b{display:block;font-size:26px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;line-height:1.15}
.card{border-radius:14px;border:1px solid #e4e4e2;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card>h3:first-child{margin:-16px -16px 14px;padding:10px 16px;background:linear-gradient(90deg,#f58b1f,#fdb515);color:#fff;border-radius:13px 13px 0 0;letter-spacing:.14em}
.card h3{color:#d0640c}
.btn{border-radius:10px;border-color:#dcdcdc}
.btn.pri{background:linear-gradient(90deg,#ef7f14,#f9a825);border-color:transparent;color:#fff}.btn.pri:hover{background:linear-gradient(90deg,#d96f0c,#f09a18)}
details.guide{background:#fff7ea;border-color:#f7d9a8}
details.guide summary{color:#b35a00}details.guide h4{color:#b35a00}
.qh{background:#f08a1c}
.hp{background:#fff7ea;border-left-color:#f08a1c;color:#5a3a10}
.rowc{border-radius:12px}
.rowc>summary .n{background:linear-gradient(135deg,#ef7f14,#f9a825)}
.chip:has(input:checked){background:#ffe9cc;border-color:#e8731a;color:#a24a00}
.addbar{background:#fffaf2;border-color:#f3c98e}
.banner{border-radius:14px}
input:focus,select:focus,textarea:focus{outline:2px solid #f7c58a;border-color:#e8731a}
@media(max-width:700px){header.top{position:static}nav.steps{top:0}.bnr .bt b{font-size:20px}.sep{display:none}}
.msg.info{background:#fff7ea;border-color:#f08a1c}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:999px;z-index:60;font-size:14px;max-width:90%}#toast[hidden]{display:none}
#app>.card{background:none;border:0;padding:0}

/* ===== Aggiunte app Huawei ===== */
.dlgf{display:grid;gap:10px;margin:8px 0}
.addbar.b4{grid-template-columns:minmax(220px,3fr) 120px minmax(160px,2fr) auto}
@media(max-width:640px){.addbar.b4{grid-template-columns:1fr}}
.unv{display:inline-block;font-size:11px;font-weight:700;color:#8a5a00;background:#fff3dc;border:1px solid #f0d49a;border-radius:999px;padding:0 7px;margin-left:3px}
.msg.spec{font-size:13px;line-height:1.6}.msg.spec small{color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.kpi>div{background:#fafafb;border:1px solid #e4e4e2;border-radius:10px;padding:7px 10px}
.kpi small{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}.kpi b{display:block;font-size:19px}
.mpr{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:end;border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.mpr>.n{background:linear-gradient(135deg,#ef7f14,#f9a825);color:#fff;border-radius:8px;padding:4px 0;text-align:center;font-weight:700;font-size:12.5px;align-self:center}
@media(max-width:560px){.mpr{grid-template-columns:1fr}.mpr>.n{justify-self:start;padding:3px 10px}}
.tw{overflow-x:auto;margin-top:12px}
table.calc td,table.calc th{white-space:nowrap}
table.calc td small{display:block;color:var(--mut);font-size:10.5px}
table.calc td.err{background:var(--err-s);color:var(--err);font-weight:700}
table.calc td.warn{background:var(--warn-s);color:var(--warn);font-weight:700}
table.calc td.mut{color:var(--mut)}
.ro{background:#f6f6f5!important;color:#444}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:4px 0 12px}
.presets .btn{text-align:left;line-height:1.3;padding:9px 11px}.presets .btn small{display:block;font-weight:400;color:var(--mut);margin-top:3px;font-size:12px}
.seg{display:grid;grid-template-columns:auto 118px 118px 120px 1fr auto;gap:8px 10px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px;background:#fff}
.seg>.n{background:linear-gradient(135deg,#ef7f14,#f9a825);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;align-self:center}
.seg .chips{align-self:center}.seg .chip{padding:3px 8px;font-size:12.5px}
.seg input[type=time]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;min-height:38px;background:#fff}
@media(max-width:820px){.seg{grid-template-columns:auto 1fr 1fr auto}.seg>.fld:nth-of-type(3){grid-column:2/4}.seg .chips{grid-column:1/-1}.seg>.btn{grid-row:1;grid-column:4}}
.tl{margin:6px 0 4px}
.tlr{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;margin:5px 0;font-size:12.5px;font-weight:600}
.tlb{position:relative;height:20px;background:#eceeef;border-radius:5px;overflow:hidden}
.tlb i,.tlf i{position:absolute;top:0;bottom:0}
.tlb i.c{background:#1a7f4b}.tlb i.d{background:#e8731a}
.tlf{position:relative;height:5px;margin-top:2px;border-radius:3px;overflow:hidden;opacity:.8}
.tlf .F1{background:#d9261c}.tlf .F2{background:#f5a117}.tlf .F3{background:#9aa7b4}
.tlx{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:11px;color:var(--mut)}.tlx>div{display:flex;justify-content:space-between}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.ck{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;cursor:pointer}
.ck input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
.ck:has(input:checked){background:var(--ok-s);border-color:#b7e0c9}
.chk h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:#d0640c}
ol.proc{margin:6px 0;padding-left:30px}ol.proc li{margin:0 0 8px;line-height:1.45}
@media print{
  .tlb i,.tlf i,.leg i,.tlb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .tl{max-width:170mm}
  #print .unv{border:0;background:none;padding:0}
  #toast{display:none!important}

function strCalc(v,j){

  const r={n,s,tmn,tmx,kwp:ok(p)?n*s*p/1000:NaN,voc25:n*voc,vocmax:n*voc*(1+bv*(tmn-25)),vmpmin:n*vmp*(1+gp*(tmx-25)),vmpmax:n*vmp*(1+gp*(tmn-25)),isc:s*isc,imp:s*imp,c:{},msgs:[]};
  const E=(lv,t,k)=>{r.msgs.push({lv,t});if(k)r.c[k]=lv;};

  if(allOpt)E('info','Ottimizzatori su tutti i moduli: la tensione della stringa è regolata dagli ottimizzatori. Verifica il numero minimo e massimo di ottimizzatori per stringa sul datasheet.');

    if(ok(sp.mmax)&&ok(r.vmpmax)&&r.vmpmax>sp.mmax)E('warn','A '+tmn+' °C la Vmp sale a '+f1(r.vmpmax,0)+' V, sopra il massimo MPPT ('+sp.mmax+' V).','vmpmax');

  if(ok(sp.isc)&&r.isc>sp.isc)E('err','Corrente di corto circuito '+f1(r.isc,1)+' A oltre il massimo per MPPT ('+sp.isc+' A).','isc');
  if(ok(sp.imax)&&ok(r.imp)&&r.imp>sp.imax)E('warn','Corrente di lavoro '+f1(r.imp,1)+' A oltre il massimo per MPPT ('+sp.imax+' A): l\'inverter limita la corrente (perdita di produzione).','imp');
  if(sp.nin&&s>sp.nin)E('warn',s+' stringhe in parallelo ma l\'MPPT ha '+sp.nin+' ingress'+(sp.nin>1?'i':'o')+': servono connettori a Y, verifica sul manuale che sia ammesso.','s');
  return r;
}

function calcHtml(i){
  const v=S.invs[i],sp=spec(v);if(!sp)return '';
  const cell=(val,cls,lim)=>'<td class="'+(cls||'')+'">'+val+(lim?'<small>'+lim+'</small>':'')+'</td>';
  let rows='',msgs='';
  v.mppt.forEach((m,j)=>{
    const r=strCalc(v,j);
    if(!r){rows+='<tr><td>MPPT '+(j+1)+'</td><td colspan="7" class="mut">non usato</td></tr>';return;}
    rows+='<tr><td>MPPT '+(j+1)+'</td>'+cell(r.n+' × '+r.s)+cell(f1(r.kwp,2))+cell(f1(r.voc25,0),r.c.voc25,'avvio '+f1(sp.vst,0))+cell(f1(r.vocmax,0),r.c.vocmax,'max '+f1(sp.vmax,0))+
      cell(f1(r.vmpmin,0)+' – '+f1(r.vmpmax,0),r.c.vmpmin||r.c.vmpmax,f1(sp.mmin,0)+'–'+f1(sp.mmax,0))+cell(f1(r.imp,1),r.c.imp,'max '+f1(sp.imax,1))+cell(f1(r.isc,1),r.c.isc,'max '+f1(sp.isc,1))+'</tr>';
    msgs+=r.msgs.map(x=>'<div class="msg '+x.lv+'"><b>MPPT '+(j+1)+'</b> '+esc(x.t)+'</div>').join('');
  });
  const kwp=invKwp(v),ratio=ok(sp.kw)&&sp.kw?kwp/sp.kw:NaN;
  let rm='';
  if(kwp){
    if(ok(sp.pv)&&kwp>sp.pv)rm='<div class="msg warn">'+f1(kwp,2)+' kWp supera la potenza FV massima consigliata ('+f1(sp.pv,1)+' kWp).</div>';
    else if(!ok(sp.pv)&&ratio>1.5)rm='<div class="msg info">Rapporto DC/AC '+f1(ratio,2)+': verifica sul datasheet la potenza FV massima ammessa.</div>';
  }
  return '<div class="tw"><table class="t calc"><thead><tr><th></th><th>Moduli × stringhe</th><th>kWp</th><th>Voc 25 °C</th><th>Voc a '+esc(S.sito.tmin||'-10')+' °C</th><th>Vmp caldo – freddo</th><th>Imp A</th><th>Isc A</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="kpi"><div><small>Potenza FV</small><b>'+f1(kwp,2)+' kWp</b></div><div><small>Rapporto DC/AC</small><b>'+f1(ratio,2)+'</b></div>'+(v.ott&&v.ott!=='Nessuno'?'<div><small>Ottimizzatori</small><b>'+f1(optCount(v),0)+'</b></div>':'')+'</div>'+rm+msgs;
}

/* ===== REGOLE ===== */
function validate(){
  const R=[],add=(lv,st,t)=>R.push({lv,st,t});
  const t=tot(),pimm=num(S.rete.pimm),pprel=num(S.rete.pprel),mono=S.rete.allaccio==='Monofase',bp=S.bp;
  // 1 Cantiere
  if(!S.meta.cliente)add('warn',0,'Manca il nome del cliente.');
  if(!S.meta.email&&!S.fs.owner)add('warn',0,'Manca l\'email del proprietario: serve per assegnargli l\'impianto su FusionSolar.');
  if(!ok(pimm))add('warn',0,'Indica la potenza disponibile in immissione: serve per decidere la limitazione.');
  if(!ok(pprel))add('warn',0,'Indica la potenza disponibile in prelievo del contratto.');
  // 2 Inverter
  if(!S.invs.length)add('err',1,'Non hai inserito l\'inverter.');
  S.invs.forEach((v,i)=>{
    const sp=spec(v),n='I'+(i+1);
    if(!sp){add('err',1,n+': scegli il modello.');return;}
    if(mono&&sp.ph===3)add('err',1,n+' '+invName(v)+' è trifase ma l\'allaccio è monofase.');
    if(sp.custom&&(!ok(sp.vmax)||!ok(sp.kw)))add('warn',1,n+': completa i dati di targa dell\'inverter non in elenco.');
    if(sp.optreq&&(!v.ott||v.ott!=='Su tutti i moduli'))add('err',2,n+' '+invName(v)+' richiede gli ottimizzatori su tutti i moduli.');
  });
  if(mono&&t.kw1>6)add('warn',1,'Impianto monofase da '+f1(t.kw1,2)+' kW: la CEI 0-21 prevede il monofase fino a 6 kW, oltre serve l\'allaccio trifase.');
  if(!mono&&t.ph1&&t.kw1>6)add('warn',1,'Inverter monofase per '+f1(t.kw1,2)+' kW su allaccio trifase: distribuiscili sulle fasi (squilibrio massimo 6 kW).');
  if(/^Integrato/.test(S.rete.spi)&&t.kwac>11.08)add('warn',1,'Potenza complessiva '+f1(t.kwac,2)+' kW oltre 11,08 kW: la CEI 0-21 richiede il SPI esterno.');
  if(S.rete.gc!=='CEI0-21')add('warn',1,'Il codice di rete non è CEI0-21: verifica che sia corretto per la bassa tensione.');
  if(S.invs.length>1){
    const ad=S.invs.map((v,i)=>String(v.addr||(i+1)));if(new Set(ad).size<ad.length)add('err',1,'Due inverter hanno lo stesso indirizzo RS485.');
    const wb=S.invs.filter(v=>packsOf(v).length).length;
    if(wb&&wb<S.invs.length)add('err',3,'Inverter con batteria e inverter senza batteria non si possono collegare in cascata.');
    if(S.invs.length>3&&(wb||t.ph1))add('err',4,'Con batterie o inverter monofase lo Smart Dongle gestisce al massimo 3 inverter in cascata.');
  }
  // 3 Stringhe
  const md=S.mods[0];
  if(S.invs.length&&(!md||!ok(num(md.voc))||!ok(num(md.isc))||!ok(num(md.p))))add('warn',2,'Completa i dati del modulo fotovoltaico (Pmax, Voc, Vmp, Isc).');
  S.invs.forEach((v,i)=>{
    const sp=spec(v),n='I'+(i+1);if(!sp)return;
    let used=0;
    v.mppt.forEach((m,j)=>{const r=strCalc(v,j);if(!r)return;used++;r.msgs.forEach(x=>{if(x.lv!=='info')add(x.lv,2,n+' MPPT '+(j+1)+': '+x.t);});});
    if(!used)add('warn',2,n+': nessuna stringa configurata.');
    const kwp=invKwp(v);if(ok(sp.pv)&&kwp>sp.pv)add('warn',2,n+': '+f1(kwp,2)+' kWp oltre la potenza FV massima consigliata ('+f1(sp.pv,1)+' kWp).');
    if(v.ott&&v.ott!=='Nessuno'&&!v.aopt)add('warn',2,n+': scegli il modello di ottimizzatore.');
  });
  // 4 Batterie
  const fams=new Set();
  S.batts.forEach((b,i)=>{
    const v=S.invs.find(x=>x.id===b.inv),pk=pack(b),n='B'+(i+1);
    if(!v){add('err',3,n+': scegli a quale inverter è collegato.');return;}
    if(!pk)return;fams.add(pk.M.fam);
    const sp=spec(v);if(!sp)return;
    if(sp.batU&&sp.batU.includes(pk.M.fam))add('warn',3,n+': compatibilità di LUNA2000 '+pk.M.fam+' con '+invName(v)+' non verificata: controlla il datasheet.');
    else if(!sp.bat.includes(pk.M.fam))add('err',3,n+': '+invName(v)+' non è compatibile con LUNA2000 '+pk.M.fam+'.');
  });
  if(fams.size>1)add('err',3,'LUNA2000 S0 e S1 non si possono mescolare, nemmeno su inverter diversi in cascata.');
  S.invs.forEach((v,i)=>{
    const P=packsOf(v);if(!P.length)return;const fam=BMOD[P[0].m]?BMOD[P[0].m].fam:'S0',mx=maxPacks(v,fam),sp=spec(v);
    if(P.length>mx)add(fam==='S0'||(sp&&sp.maxS1)?'err':'warn',3,'I'+(i+1)+': '+P.length+' pacchi '+fam+', massimo '+mx+' per inverter'+(fam==='S1'&&!(sp&&sp.maxS1)?' (valore da verificare sul datasheet)':'')+'.');
    if(new Set(P.map(b=>b.m)).size>1)add('warn',3,'I'+(i+1)+': pacchi con moduli di taglia diversa (5 e 7 kWh): verifica sul manuale che sia ammesso.');
  });
  const bk=art(S.bk.a);
  if(bk){
    if(!S.batts.length)add('warn',3,'Hai scelto il backup ma nessuna batteria: in blackout non ci sarebbe energia.');
    S.invs.forEach((v,i)=>{const sp=spec(v);if(!sp)return;
      if(bk.ph!==sp.ph)add('err',3,S.bk.a+' è '+(bk.ph===3?'trifase':'monofase')+' ma I'+(i+1)+' '+invName(v)+' è '+(sp.ph===3?'trifase':'monofase')+'.');
      else if(sp.bk&&!sp.bk.includes(S.bk.a))add('warn',3,S.bk.a+' con '+invName(v)+': compatibilità non indicata, verifica sul datasheet.');
      else if(unv(sp,'bk'))add('info',3,'Compatibilità di '+S.bk.a+' con '+invName(v)+' da verificare sul datasheet.');});
    if(S.bk.a==='SmartGuard-63A-T0'&&S.invs.length>3)add('err',3,'SmartGuard-63A-T0 gestisce al massimo 3 inverter MAP0 in parallelo.');
    if(!S.bk.carichi)add('info',3,'Descrivi i carichi da alimentare in blackout.');
  }
  // 5 Comunicazione e meter
  const met=art(S.met.a),emma=hasEmma();
  if(S.invs.length&&!S.com.a)add('err',4,'Scegli come l\'impianto va online (Smart Dongle o EMMA): senza, non compare su FusionSolar.');
  if(!S.com.a&&S.invs.some(v=>{const sp=spec(v);return sp&&sp.dongle;}))add('info',4,'Gli inverter M1-HC includono il Wifi Dongle FE: sceglilo come dispositivo.');
  if(S.com.a==='INCL'&&!S.invs.some(v=>{const sp=spec(v);return sp&&sp.dongle;}))add('err',4,'Il Wifi Dongle incluso c\'è solo con gli inverter M1-HC: scegli il dongle da ordinare.');
  if(S.com.a&&S.com.conn===OPT.wl&&!S.com.r24)add('warn',4,'Il Wi-Fi di '+(hasEmma()?'EMMA':'Smart Dongle')+' funziona solo a 2,4 GHz: verifica router e segnale vicino al dispositivo.');
  if(S.com.a==='4G Dongle')add('info',4,'Il listino indica il 4G Dongle per inverter L1/M2/M3/M5: verifica la compatibilità con '+[...new Set(S.invs.map(invName))].join(', ')+'.');
  if(emma&&S.invs.length>3)add('err',4,'EMMA-A02 gestisce al massimo 3 inverter.');
  if(emma&&met)add('info',4,'EMMA ha il meter integrato: il meter '+S.met.a+' normalmente non serve.');
  if(S.batts.length&&!hasMeter())add('err',4,'Con la batteria serve il meter al punto di connessione (o EMMA): senza, la batteria non sa quando caricare e scaricare.');
  if(met){
    if(met.f!=='met')add('err',4,S.met.a+' non è un meter per il punto di connessione.');
    if(met.ph===1&&(!mono||t.ph3))add('err',4,S.met.a+' è monofase: con allaccio o inverter trifase serve il DTSU666-H.');
    if(met.ph===3&&mono)add('warn',4,'Allaccio monofase: il meter giusto è il DDSU666-H.');
    if(String(S.met.addr||'')!=='11')add('warn',4,'Indirizzo del meter '+(S.met.addr||'vuoto')+': quello di fabbrica è 11. Usa lo stesso valore nel meter e nell\'app.');
  }
  const pac=S.met.pac;
  if(S.invs.length&&!pac)add('warn',4,'Scegli la regola di immissione in rete (illimitata o limitata).');
  if(pac&&pac!=='unl'&&!hasMeter())add('err',4,'La limitazione dell\'immissione funziona solo con il meter (o EMMA).');
  if((pac==='kw'||pac==='pc')&&!ok(num(S.met.plim)))add('err',4,'Indica il valore della limitazione.');
  if(pac==='kw'&&ok(pimm)&&num(S.met.plim)>pimm)add('warn',4,'Limite di immissione '+S.met.plim+' kW oltre la potenza disponibile ('+f1(pimm,2)+' kW).');
  if(pac==='pc'&&ok(pimm)&&t.kwac&&num(S.met.plim)/100*t.kwac>pimm+0.001)add('warn',4,'Limite '+S.met.plim+' % = '+f1(num(S.met.plim)/100*t.kwac,2)+' kW, oltre la potenza in immissione ('+f1(pimm,2)+' kW).');
  if((!pac||pac==='unl')&&ok(pimm)&&t.kwac>pimm)add('err',4,'Inverter da '+f1(t.kwac,2)+' kW e immissione disponibile '+f1(pimm,2)+' kW: imposta la limitazione.');
  if(pac==='zero'&&/^Ritiro|^Cessione|^Comunità|^Scambio/.test(S.rete.regime||''))add('warn',4,'Immissione zero ma il regime prevede la cessione in rete: verifica che sia voluto.');
  if(pac&&pac!=='unl'&&met&&met.ph===1&&/^Per singola/.test(S.met.limmode))add('err',4,'Con meter monofase è disponibile solo la limitazione sulla potenza totale.');
  if(pac&&pac!=='unl'&&S.met.fsp==='')add('info',4,'Indica la potenza da applicare se si perde la comunicazione con il meter.');
  if(S.acc.some(x=>{const a=art(x.a);return a&&a.ev;})&&!emma)add('info',4,'Per gestire la wallbox insieme a FV e batteria serve EMMA-A02.');
  // 6 Programmazione batteria
  if(S.batts.length){
    const smx=num(bp.socmax),smn=num(bp.socmin),sbk=num(bp.socbk);
    if(!ok(smx)||!ok(smn))add('warn',5,'Imposta il SOC di fine carica e di fine scarica.');
    [['socmax','fine carica'],['socmin','fine scarica'],['socbk','backup'],['gridsoc','fine carica dalla rete']].forEach(([k,l])=>{const x=num(bp[k]);if(ok(x)&&(x<0||x>100))add('err',5,'SOC di '+l+' fuori da 0-100 %.');});
    if(ok(smx)&&ok(smn)&&smn>=smx)add('err',5,'Il SOC di fine scarica deve essere minore del SOC di fine carica.');
    if(S.bk.a&&!ok(sbk))add('warn',5,'Imposta il SOC di backup: è l\'energia riservata ai blackout.');
    if(ok(sbk)&&ok(smx)&&sbk>smx)add('err',5,'Il SOC di backup supera il SOC di fine carica.');
    if(t.kwbOk&&t.kwb){[['pch','carica'],['pdis','scarica']].forEach(([k,l])=>{if(num(bp[k])>t.kwb)add('info',5,'Potenza di '+l+' '+bp[k]+' kW: le batterie arrivano a '+f1(t.kwb,1)+' kW, verrà limitata.');});}
    if(bp.grid){
      if(/^Monodirezionale/.test(S.rete.accumulo||''))add('err',5,'Carica dalla rete attiva ma l\'accumulo è dichiarato monodirezionale nella pratica.');
      else add('warn',5,'Carica dalla rete attiva: l\'accumulo è bidirezionale, verifica che sia dichiarato così nella pratica e su GAUDÌ.');
      if(!ok(num(bp.gridsoc)))add('warn',5,'Imposta il SOC di fine carica dalla rete.');
      if(!ok(num(bp.gridp)))add('warn',5,'Imposta la potenza massima di carica dalla rete.');
      else if(ok(pprel)&&num(bp.gridp)>=pprel)add('err',5,'Carica dalla rete '+bp.gridp+' kW ≥ potenza in prelievo '+f1(pprel,1)+' kW: con i consumi della casa scatta il contatore.');
      else if(ok(pprel)&&num(bp.gridp)>pprel*0.7)add('warn',5,'Carica dalla rete '+bp.gridp+' kW vicina alla potenza in prelievo ('+f1(pprel,1)+' kW): resta poco margine per i consumi.');
    }
    if(bp.mode==='tou'){
      if(!S.tou.length)add('err',5,'Modalità a fasce orarie senza fasce: aggiungile.');
      touIssues().forEach(x=>add(x.lv,5,x.t));
      if(S.tou.some(x=>x.az==='c')&&!bp.grid)add('info',5,'Ci sono fasce di carica ma la carica dalla rete è disattivata: in quelle fasce la batteria carica solo dal FV.');
      if(!S.tou.some(x=>x.az==='d'))add('warn',5,'Nessuna fascia di scarica: in modalità TOU la batteria alimenta la casa solo nelle fasce di scarica.');
    }
    if(bp.mode==='ffg'&&(pac==='zero'||/^Immissione zero/.test(S.rete.regime||'')))add('err',5,'"Immissione totale in rete" non ha senso con immissione zero.');
    if(bp.mode==='tpd')add('info',5,'Dispacciamento di terze parti: serve un sistema esterno che invii i comandi, altrimenti la batteria resta ferma.');
  }
  // 7 FusionSolar
  if(S.invs.length){
    if(!fsNome())add('warn',6,'Dai un nome all\'impianto su FusionSolar.');
    if(!S.fs.owner&&!S.meta.email)add('warn',6,'Manca l\'email del proprietario da invitare.');
    if(!S.fs.dataconn)add('info',6,'Indica la data di connessione alla rete.');
    if(S.fs.tariffa===OPT.fstar[1]?!(S.fs.pf1&&S.fs.pf2&&S.fs.pf3):!S.fs.pacq)add('info',6,'Inserisci i prezzi di acquisto per vedere i risparmi in FusionSolar.');
    if(!S.fs.pven)add('info',6,'Inserisci il prezzo di vendita dell\'energia immessa.');
    const miss=S.invs.filter(v=>!v.sn).length;if(miss)add('info',6,miss+' inverter senza numero seriale.');
  }
  // 8 Collaudo
  const L=chkOn(),done=L.filter(x=>S.chk[x.k]).length;
  if(S.invs.length&&done<L.length)add('info',7,'Checklist di collaudo: '+done+' di '+L.length+' voci completate.');
  if(/^CEI0-21/.test(S.rete.gc||'')&&S.invs.length&&!S.chk.ips)add('warn',7,'Test IPS (CEI 0-21) non ancora segnato come eseguito: il report serve per la pratica.');
  return R;
}
function stepStatus(R){const o={};R.forEach(r=>{const cur=o[r.st];if(r.lv==='err')o[r.st]='err';else if(r.lv==='warn'&&cur!=='err')o[r.st]='warn';});return o;}
/* ===== DISTINTA ===== */
function bom(){
  const M=new Map(),add=(c,q,kit,d)=>{if(!c||!q)return;const k=c+(d?'|'+d:'');const r=M.get(k)||{c,d,q:0,qk:0};r.q+=q;if(kit)r.qk+=q;M.set(k,r);};
  S.invs.forEach(v=>{const sp=spec(v);if(!sp)return;if(sp.custom)add(CUSTOM_INV,1,false,sp.d);else add(v.a,1);});
  S.batts.forEach(b=>{const pk=pack(b);if(!pk)return;add(pk.M.pm,1);add(b.m,pk.n);if(b.muro)add(pk.M.br,1);});
  if(S.com.a==='INCL')add('Wifi Dongle FE',1,true);else if(S.com.a)add(S.com.a,1);
  if(art(S.met.a))add(S.met.a,1);
  if(S.bk.a)add(S.bk.a,1);
  S.invs.forEach(v=>{if(v.aopt)add(v.aopt,optCount(v));});
  S.acc.forEach(x=>add(x.a,Math.max(1,parseInt(x.q,10)||1),false,x.a==='ALTRO'?(x.d||'Altro'):''));
  return [...M.values()].map(r=>{const a=art(r.c);return {c:r.c===CUSTOM_INV||r.c==='ALTRO'?'(fuori listino)':r.c,d:r.d||(a?a.d:''),q:r.q,qk:r.qk,o:Math.max(0,r.q-r.qk),p:a&&ok(a.p)?a.p:null};});
}

function runTest(){
  const R=validate(),e=R.filter(x=>x.lv==='err'),w=R.filter(x=>x.lv==='warn'),i=R.filter(x=>x.lv==='info');

/* ===== STEP 8: COLLAUDO E DOCUMENTI ===== */
function stepTest(){
  const R=validate(),e=R.filter(x=>x.lv==='err').length,w=R.filter(x=>x.lv==='warn').length;
  return head('Collaudo e documenti','Controlla la coerenza, spunta il collaudo e prepara i documenti.')+

  '<div class="card"><div class="chips"><button type="button" class="btn pri" data-act="run-test">▶ Esegui test</button><span class="sub" style="align-self:center">Stato attuale: '+(e?e+' errori':'nessun errore')+', '+w+' avvisi</span></div><div id="testout" style="margin-top:12px">'+(LASTTEST?LASTTEST.html:'')+'</div></div>'+
  '<div class="card"><h3>Procedura per FusionSolar</h3>'+proc()+'</div>'+
  '<div class="card chk"><h3>Checklist di collaudo</h3>'+chkHtml()+'</div>'+
  '<div class="card"><h3>Documenti da stampare</h3><p class="sub">Scegli quali includere, poi premi Stampa (dal browser puoi salvare in PDF).</p><div class="docs">'+
  DOCS.map(d=>'<label><input type="checkbox" data-doc="'+d.id+'" checked> <span><b>'+esc(d.t)+'</b><small>'+esc(d.s)+'</small></span></label>').join('')+'</div>'+
  '<div class="chips" style="margin-top:12px"><button type="button" class="btn pri" data-act="print">🖨 Stampa / salva PDF</button><button type="button" class="btn" data-act="exp-json">⬇ File per Claude (.json)</button><button type="button" class="btn" data-act="exp-csv">⬇ Distinta (.csv)</button></div></div>'+
  '<div class="card">'+fld('notes','Note finali',{type:'textarea'})+'</div>';
}

  '<path d="M4 4h16l-2 10H6z"/><path d="M5 9h14M9.3 4l-.6 10M14.7 4l.6 10"/><path d="M12 14v6M8 20h8"/>',
  '<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 11v2"/><path d="M11 9l-2 3h4l-2 3"/>',
  '<path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/>',

const FN=[stepCantiere,stepInverter,stepStringhe,stepBatterie,stepMeter,stepProg,stepFusion,stepTest];
const LIVE={calc:k=>calcHtml(+k),kwp:kwpCard,tl:touTimeline,touiss:touIssHtml};
function live(){$$('[data-live]').forEach(el=>{const [f,k]=el.dataset.live.split(':');if(LIVE[f])el.innerHTML=LIVE[f](k);});}
function render(keep){
  const y=window.scrollY,ae=document.activeElement,fp=ae&&ae.dataset?ae.dataset.p:null;
  const body=FN[step]();
  $('#app').innerHTML='<div class="bnr"><div class="bi"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+SICON[step]+'</svg></div><div class="bt"><small>Huawei FusionSolar · passo '+(step+1)+' di '+STEPS.length+'</small><b>'+esc(CURTITLE)+'</b></div></div><div class="card">'+body+'</div>';
  renderNav();
  if(keep!==false)window.scrollTo(0,y);
  if(fp&&keep!==false){const el=$('#app [data-p="'+fp+'"]');if(el&&el.tagName!=='SELECT')try{el.focus({preventScroll:true});}catch(e){}}
}
function renderNav(){
  const st=stepStatus(validate());
  $('#nav').innerHTML=STEPS.map((s,i)=>'<button type="button" data-act="goto" data-st="'+i+'" class="'+(i===step?'on':'')+'"><span class="ic c'+(i%5)+'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+SICON[i]+'</svg><i class="dot '+(st[i]||'')+'"></i></span>'+esc(s.t.replace(/^\d+ · /,''))+'</button>').join('');
  const on=$('#nav .on');if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}
  $('#prev').disabled=step===0;$('#next').disabled=step===STEPS.length-1;
  $('#mid').textContent='Passo '+(step+1)+' di '+STEPS.length;
}
function goto(i){step=Math.max(0,Math.min(STEPS.length-1,i));save();render(false);window.scrollTo(0,0);}
/* ===== AZIONI ===== */
function toast(t){const d=$('#toast');d.textContent=t;d.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{d.hidden=true;},2600);}
function qty(id,max){return Math.max(1,Math.min(max||50,parseInt($(id).value,10)||1));}
function act(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,L=b.dataset.list;
  if(a==='help'){const f=b.closest('.fld');const hp=f&&f.querySelector('.hp');if(hp)hp.hidden=!hp.hidden;return;}
  if(a==='goto'){goto(+b.dataset.st);return;}
  if(a==='add-inv'){const v=$('#addInv').value;if(!v){toast('Scegli il modello dal menu');return;}const n=qty('#addInvQty',10);let last;for(let q=0;q<n;q++){last=newInv(v);if(S.invs.length)last.addr=String(S.invs.length+1);S.invs.push(last);}
    if(S.invs.length>1&&!S.invs[0].addr)S.invs[0].addr='1';OPEN[last.id]=true;touch();render();toast(n>1?n+' inverter aggiunti':'Inverter aggiunto');return;}
  if(a==='add-mod'){const m=newMod();S.mods.push(m);OPEN[m.id]=true;touch();render();return;}
  if(a==='add-batt'){const inv=$('#addBi').value,m=$('#addBm').value,n=$('#addBn').value;S.batts.push({id:uid(),inv,m,n,snpm:'',snb:'',desc:'',muro:false});touch();render();toast('Pacco aggiunto');return;}
  if(a==='add-acc'){const c=$('#addAcc').value;if(!c)return;const o={id:uid(),a:c,q:String(qty('#addAccQty',99)),sn:'',desc:'',d:''};S.acc.push(o);if(c==='ALTRO')OPEN[o.id]=true;touch();render();return;}
  if(a==='add-tou'){if(S.tou.length>=14)return;S.tou.push({id:uid(),da:'',a:'',az:'d',g:['1','2','3','4','5','6','7']});touch();render();return;}
  if(a==='tou-preset'){const p=TOU_PRESETS.find(x=>x.id===b.dataset.id);if(!p)return;if(S.tou.length&&!confirm('Sostituire le fasce attuali con il preset "'+p.t+'"?'))return;
    S.tou=p.seg.map(s=>({id:uid(),da:s[0],a:s[1],az:s[2],g:s[3].split('')}));touch();render();if(p.seg.some(s=>s[2]==='c')&&!S.bp.grid)toast('Per caricare dalla rete attiva "Carica dalla rete"');return;}
  if(a==='del'){
    if(!confirm('Eliminare questa voce?'))return;const it=S[L][i];
    if(L==='invs'){const nb=S.batts.filter(x=>x.inv===it.id).length;if(nb&&!confirm('Ci sono '+nb+' pacchi batteria collegati: eliminare anche quelli?'))return;S.batts=S.batts.filter(x=>x.inv!==it.id);}
    S[L].splice(i,1);
    if(L==='mods')S.invs.forEach(v=>v.mppt.forEach(m=>{if(m.m===it.id)m.m='';}));
    touch();render();return;}
  if(a==='dup'){const it=JSON.parse(JSON.stringify(S[L][i]));it.id=uid();if(it.sn)it.sn='';if(L==='invs')it.addr=String(S.invs.length+1);S[L].splice(i+1,0,it);touch();render();return;}
  if(a==='prev'){goto(step-1);return;}
  if(a==='next'){goto(step+1);return;}
  if(a==='run-test'){LASTTEST=runTest();$('#testout').innerHTML=LASTTEST.html;$('#testout').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(a==='print'){doPrint();return;}
  if(a==='exp-json'){expJson();return;}
  if(a==='exp-csv'){expCsv();return;}
  if(a==='imp'){$('#impFile').click();return;}
  if(a==='reset'){if(confirm('Iniziare un nuovo cantiere? I dati attuali verranno cancellati (salva prima il file .json se ti servono).')){S=blank();step=0;LASTTEST=null;OPEN={};save();render(false);window.scrollTo(0,0);}return;}
}
function onChange(e){
  const t=e.target;
  if(t.dataset&&t.dataset.doc!==undefined)return;
  if(t.dataset&&t.dataset.arr){const p=t.dataset.arr,v=t.dataset.v;let ar=getP(p);if(!Array.isArray(ar)){ar=[];setP(p,ar);}const ix=ar.indexOf(v);if(t.checked&&ix<0)ar.push(v);if(!t.checked&&ix>=0)ar.splice(ix,1);touch();if(t.dataset.rr==='1')render();else live();return;}
  if(!t.dataset||!t.dataset.p)return;
  setP(t.dataset.p,t.type==='checkbox'?t.checked:t.value);
  if(/^invs\.\d+\.(a|spec\.nmppt)$/.test(t.dataset.p))fixInv(S.invs[+t.dataset.p.split('.')[1]]);
  touch();
  if(t.dataset.rr==='1')render();else live();
}
function onInput(e){const t=e.target;if(!t.dataset||!t.dataset.p)return;if(t.tagName==='SELECT'||t.type==='checkbox')return;setP(t.dataset.p,t.value);touch();live();}
/* ===== STAMPA ED ESPORTAZIONE ===== */
function today(){return new Date().toLocaleDateString('it-IT');}
function doPrint(){
  const sel=$$('input[data-doc]').filter(x=>x.checked).map(x=>x.dataset.doc);
  if(!sel.length){toast('Seleziona almeno un documento');return;}
  let h='<h1>Impianto Huawei FusionSolar</h1><div class="meta">'+esc(S.meta.cliente||'(cliente)')+' · '+esc([S.meta.indirizzo,S.meta.comune].filter(Boolean).join(', '))+' · generato il '+today()+'</div>';
  DOCS.filter(d=>sel.includes(d.id)).forEach((d,i)=>{h+='<div class="'+(i?'pb':'')+'">'+d.fn()+'</div>';});
  h+='<p class="meta" style="margin-top:20px">Nessuna password è inclusa in questo documento. Dati tecnici: datasheet Huawei; articoli: '+LISTINO+'.</p>';
  $('#print').innerHTML=h;
  setTimeout(()=>window.print(),50);
}
function fname(ext){const c=(S.meta.cliente||'impianto').replace(/[^\w\-]+/g,'_').slice(0,30);return 'Huawei_'+c+'_'+new Date().toISOString().slice(0,10)+'.'+ext;}
function dl(name,text,type){const b=new Blob([text],{type:type||'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},500);}
function expJson(){dl(fname('json'),JSON.stringify({tipo:'huawei-fusionsolar-impianto',versione:1,data:new Date().toISOString(),listino:LISTINO,impianto:S,riepilogo:{kwp:+tot().kwp.toFixed(3),kwac:tot().kwac,kwh:tot().kwh,controlli:validate()}},null,1),'application/json');toast('File salvato: allegalo a Claude');}
function expCsv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',n=v=>v==null?'':String(v).replace('.',',');
  const rows=[['Codice','Descrizione','Totale','Incluso','Da ordinare','Prezzo listino €','Totale listino €']].concat(bom().map(r=>[r.c,r.d,r.q,r.qk,r.o,n(r.p),r.p==null?'':n(+(r.p*r.o).toFixed(2))]));
  dl(fname('csv'),'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n')+'\r\n'+q('Prezzi: '+LISTINO+', IVA esclusa'),'text/csv');}
function impFile(f){
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!o.impianto||o.tipo!=='huawei-fusionsolar-impianto')throw new Error('non è un file di questa app');
    S=migrate(o.impianto);LASTTEST=null;OPEN={};step=0;save();render(false);toast('Impianto caricato');}catch(er){toast('File non valido: '+er.message);}};
  rd.readAsText(f);
}
/* ===== AVVIO ===== */
function init(){
  load();
  const app=$('#app');
  app.addEventListener('click',act);
  app.addEventListener('change',onChange);
  app.addEventListener('input',onInput);
  app.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.oid)OPEN[d.dataset.oid]=d.open;},true);
  $('#nav').addEventListener('click',act);
  $('#foot').addEventListener('click',act);
  $('header.top').addEventListener('click',act);
  $('#impFile').addEventListener('change',e=>{if(e.target.files[0])impFile(e.target.files[0]);e.target.value='';});
  render(false);
}
document.addEventListener('DOMContentLoaded',init);
